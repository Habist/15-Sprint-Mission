<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp</title>
  <link rel="stylesheet" href="SignUp.css">
  <link rel="icon" href="img/logopanda.svg">
</head>
<body>
  <main>
    <a href="index.html">
      <img class="main-logo" src="img/loginlogo.svg" alt="판다마켓로고">
    </a>
    <form>
      <label class="input-label" for="username">
        이메일
      </label>
      <input class="input-field" id="username" name="username" type="email">

      <label class="input-label" for="username">
        닉네임
      </label>
      <input class="input-field" id="username" name="username" type="text">
      
      <label class="input-label" for="password" >
        비밀번호
      </label>
      <input class="input-field" id="password" name="password" type="password" >
     
      <label class="input-label" for="password-repeat" >
        비밀번호 확인
      </label>
      <input class="input-field" id="password-repeat" name="password-repeat" type="password">

      <button class="sign-button">
        회원가입
      </button>
    </form>
    <div class="easy-login">
      <div class="easy-text">
        간편 로그인하기
      </div>
        <div class="login-sites">
          <a class="login-site" href="https://www.google.com/">
            <img src="img/google-icon.svg" alt="구글을 통한 로그인">
          </a>

          <a class="login-site" href=“https://www.kakaocorp.com/page/”>
            <img src="img/kakao-icon.svg" alt="구글을 통한 로그인">
          </a>
        </div>
    </div>
    <div class="signup-text">
      이미 회원이신가요? <a class="signlink-text" href="login.html">로그인</a>
    </div>
  </main>
</body>
</html>
