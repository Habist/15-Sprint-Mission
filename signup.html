<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/style/signup.css">
    <title>회원가입</title>
</head>

<body>
    <header>
        <a href="/"><img src="img/logo.png" alt="판다마켓 로고"></a>
    </header>
    <main>
        <section>

            <form class="signup-form">

                <div class="email-container">
                    <label for="signup-email">이메일</label>
                    <input id="signup-email" name="email" type="email">
                </div>
                <div class="nickname-container">
                    <label for="signup-nickname">닉네임</label>
                    <input id="signup-nickname" name="nickname" type="text">
                </div>
                <div class="password-container">
                    <label for="signup-password">비밀번호</label>
                    <input id="signup-password" name="password" type="password">
                </div>
                <div class="password-check-container">
                    <label for="signup-password-check">비밀번호 확인</label>
                    <input id="signup-password=check" name="password-check" type="password">
                </div>

                <button type="submit">
                    회원가입
                </button>
            </form>

        </section>
        <section class="social-login">
            <p>간편 로그인하기</p>
            <ul>
                <li>
                    <a href="https://www.google.com/"><img src="img/login/google_logo.png" alt="구글 계정으로 로그인"></a>
                </li>
                <li>
                    <a href="https://www.kakaocorp.com/page/"><img src="img/login/kakao_logo.png"
                            alt="카카오톡 계정으로 로그인"></a>
                </li>
            </ul>
        </section>
        <section class="ask-login-section">
            <p>이미 회원이신가요?</p>
            <a href="/login.html">로그인</a>
        </section>
    </main>
</body>

</html>
