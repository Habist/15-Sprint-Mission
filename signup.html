<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/login_style.css" />
  </head>
  <body>
    <main>
      <header>
        <a href="./index.html">
          <img src="./img/logo.png" alt="판다마켓 로고" />
        </a>
      </header>
      <form>
        <label for="email"> 이메일 </label>
        <input type="email" id="email" />
        <label for="nickname" class="nickname_label"> 닉네임 </label>
        <input type="text" id="nickname" />
        <div class="pw_area">
          <label for="password"> 비밀번호 </label>
          <div class="visible_icon"></div>
          <input type="password" name="" id="password" />
        </div>
        <div class="pw_area">
          <label for="password_check"> 비밀번호 확인</label>
          <div class="visible_icon"></div>
          <input type="password" name="" id="password_check" />
        </div>
        <a href="" class="primary_btn">회원가입</a>
      </form>
      <footer>
        <div class="sns_login">
          <span>간편 로그인하기</span>
          <ul>
            <li>
              <a href="https://www.google.com/"
                ><img
                  class="sns_icon"
                  src="./img/google_icon.png"
                  alt="구글로그인"
              /></a>
            </li>
            <li>
              <a href="https://www.kakaocorp.com/page/"
                ><img
                  class="sns_icon"
                  src="./img/kakaotalk_icon.png"
                  alt="카카오로그인"
              /></a>
            </li>
          </ul>
        </div>
        <p class="go_joinpage">
          이미 회원이신가요? <a href="./login.html">로그인</a>
        </p>
      </footer>
    </main>
  </body>
</html>
