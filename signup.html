<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="css/auth/auth.css">
    <title>판다마켓 : 회원가입</title>
</head>
<body> 
    <form class="form">
        <a class="form__logo-link" href="/">
            <img class="form__logo" src="images/logo/logo.png" alt="메인으로 이동">
        </a>
        <label class="form__label" for="email">이메일</label>
        <input class="form__input" id="email" type="email" name="email" placeholder="">
        <label class="form__label" for="nickname">닉네임</label>
        <input class="form__input" id="nickname" type="text" name="nickname" placeholder="">
        <label class="form__label" for="password">비밀번호</label> 
        <div class="form__password-input">
            <input class="form__input" id="password" type="password" name="password" placeholder="">
            <button class="form__password-toggle"type="button"></button>
        </div>
        <label class="form__label" for="password-confirm">비밀번호 확인</label> 
        <div class="form__password-input">
            <input class="form__input" id="password-confirm" type="text" name="password-confirm" placeholder="">
            <button class="form__password-toggle password-confirm"type="button"></button>
        </div>
        <button class="form__button" type="submit">회원가입</button>
        <div class="form__sns">
            <p class="form__sns-title">간편 로그인 하기</p>
            <ul class="form__sns-list">
                <li class="form__sns-item">
                    <a class="form__sns-link" href="https://www.google.com/">
                        <img class="form__sns-icon" src="images/icon/ic_google.png" alt="구글 로그인">
                    </a>
                </li>
                <li class="form__sns-item">
                    <a class="form__sns-link" href="https://www.kakaocorp.com/page/">
                        <img class="form__sns-icon" src="images/icon/ic_kakaotalk.png" alt="카카오 로그인">
                    </a>
                </li>
            </ul>
        </div>
        <p class="form__footer">
            이미 회원이신가요?
            <a class="form__footer-link" href="login.html">로그인</a>
        </p>
    </form>
</body>
</html>
