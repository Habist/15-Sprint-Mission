<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="sprint1.2.css">
  <link rel="icon" href="logopanda.svg">
</head>
<body>
<!-- 맨위에 로고랑 로그인 -->
  <header>
    <div class="headerbox">
        <a href="/">
        <img class="pandamarket" src="pandaicon.svg" alt="판다마켓로고">
        </a>
        <form>
        <a class="login" href="loginpage.html" type="button">
          로그인
        </a>
        </form>
    </div>
  </header>
<!-- 메인 배너 -->
  <main>
    <div class="banner-container">
      <div class="banner-content">
        <div class="banner-text">
          <div class="banner-message">
          일상의 모든 물건을<br>
          거래해 보세요
          </div>
         <a href="/items" class="surf-button">구경하러 가기</a>
        </div>
          <img class="panda-image" src="img/hipanda.svg" alt="시장가방을 들고 있는 판다캐릭터">
      </div>
    </div>
<!-- 메인 1번째 -->
    <div class="s1t-main">
      <div class="s1-space">
        <div class="s1-img">
        <img src="like-shirts.svg" alt="웃을 구경하는 판다">
        </div>
        <div class="s1-ment">
          <div class="s1-hotitem">
          Hot item
          </div>
          <div class="s1-best">
            <div class="s1-bestitem">
            인기 상품을<br>
            확인해 보세요
            </div>
            <div class="s1-bestcheck">
            가장 HOT한 중고거래 물품을<br>
            판다 마켓에서 확인해 보세요
            </div>
          </div>
        </div>
      </div>
    </div>
<!-- 메인 2번째 -->
    <div class="s2t-main">
      <div class="s2-space">
        <div class="s2-ment">
          <div class="s2-hotitem">
            Search
          </div>
          <div class="s2-best">
          <div class="s2-bestitem">
            구매를 원하는<br>
            상품을 검색하세요
          </div>
          <div class="s2-bestcheck">
            구매하고 싶은 물품은 검색해서<br>
            쉽게 찾아보세요
          </div>
          </div>
        </div>
        <div class="s2-img">
          <img src="serching.svg">
        </div>
      </div>
    </div>
<!-- 메인 3번째 -->
    <div class="s3t-main ">
      <div class="s3-space">
        <div class="s3-img">
          <img src="files.svg">
        </div>
        <div class="s3-ment">
          <div class="s3-hotitem">
          Register
          </div>
          <div class="s3-best">
          <div class="s3-bestitem">
          판매를 원하는<br>
          상품을 등록하세요
          </div>
          <div class="s3-bestcheck">
          어떤 물건이든 판매하고 싶은 상품을<br>
          쉽게 등록하세요
          </div>
          </div>
        </div>
      </div>
    </div>
<!-- 마지막배너 -->
    <div class="banner-container">
      <div class="banner-content">
        <div class="banner-text">
          <div class="banner-message">
            믿을 수 있는<br>
            판다마켓 중고 거래
          </div>
        </div>
      
          <img class="panda-image" src="img/talking.svg" alt="두 판다가 대화하는 모습">
      </div>
    </div>
  </main>
    <!-- 맨 아래 부분 -->
  <footer>

    <div class="foot-line">
      <div class="footer-container">
        <div class="footer-text">
          ©codeit - 2024 
        </div>
      </div>

      <div class="footer-links">
        <a class="footer-privacy-link" href="/privacy">Privacy Policy</a>                
        <a class="footer-faq-link" href="/faq">FAQ</a>
      </div>

      <ul class="footer-sns">
        <li class="facebook sns-item">
          <a href="https://www.facebook.com/" target='_blank'><img src="img/iconFacebook.svg" alt="페이스북 아이콘"></a>
        </li>
        <li class="twiitter sns-item">
          <a href="https://x.com/?lang=ko" target='_blank'><img src="img/iconX.svg" alt="X 아이콘(전 트위터)"></a>
        </li>
        <li class="youtube sns-item">
          <a href="https://www.youtube.com/?hl=ko" target='_blank'><img src="img/iconYoutube.svg" alt="유튜브 아이콘"></a>
        </li>
        <li class="instagram sns-item">
          <a href="https://www.instagram.com/" target='_blank'><img src="img/iconInsta.svg" alt="인스타그램 아이콘"></a>
        </li>
      </ul>
    </div>
  </footer>
</body>
</html>
