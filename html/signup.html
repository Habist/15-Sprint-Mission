<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="icon" type="image/svg" href="/image/logo.svg" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>

  <body class="body_signup">
    <header>
      <a href="/">
        <img class="logo" src="/image/logo.svg" alt="판다마켓 로고" />
      </a>
      <a class="logo-title" href="/">
        <img src="/image/logo_title.svg" alt="판다마켓 로고 글씨" />
      </a>
    </header>

    <main>
      <form>
        <div class="input-box">
          <label for="email">이메일</label>
          <input name="email" id="email" type="email" />
        </div>

        <div class="input-box">
          <label for="nickname">닉네임</label>
          <input name="nickname" id="nickname" type="text" />
        </div>

        <div class="input-box">
          <label for="password">비밀번호</label>
          <div class="pw-content">
            <input name="password" id="password" type="password" />
            <img
              class="eye_icon"
              src="/image/password_toggle_icon.svg"
              alt="비밀번호를 보이지 않게 하는 눈 아이콘"
            />
          </div>
        </div>

        <div class="input-box">
          <label for="password-confirm">비밀번호 확인</label>
          <div class="pw-content">
            <input name="password-confirm" id="password" type="text" />
            <img
              class="eye_icon"
              src="/image/password_show_icon.svg"
              alt="비밀번호를 보이게하는 눈 아이콘"
            />
          </div>
        </div>

        <button>회원가입</button>
      </form>
    </main>

    <footer>
      <section class="social-login">
        <span>간편 로그인하기</span>

        <div class="social-media">
          <a href="http://www.google.com/" target="_blank">
            <img src="/image/google.png" alt="구글 로고" width="42" />
          </a>
          <a href="http://www.kakaocorp.com/page/" target="_blank">
            <img src="/image/kakao.png" alt="카카오톡 로고" width="42" />
          </a>
        </div>
      </section>

      <section class="sign_up">
        <span>이미 회원이신가요?</span>
        <a href="/html/login.html">로그인</a>
      </section>
    </footer>
  </body>
</html>
